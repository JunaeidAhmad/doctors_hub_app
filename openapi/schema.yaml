openapi: 3.0.3
info:
  title: Doctor's Hub API
  version: 1.0.0
  description: Backend REST API for Doctor's Hub - A platform for searching doctors,
    hospital and diagnostic facilities, diagnostic tests, booking appointments, and
    role-based healthcare administration.
paths:
  /api/admin/dashboard-init/:
    get:
      operationId: admin_dashboard_init_retrieve
      description: Returns dashboard reference taxonomies, profile details, and role-scoped
        facilities, doctors, bookings, and tests based on whether the authenticated
        user is Super Admin, Facility Admin, or Doctor.
      summary: Initialize Admin Dashboard scoped data
      tags:
      - Admin & Staff Management
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardInitResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/platform-admins/:
    get:
      operationId: admin_platform_admins_list
      description: Returns a list of all users with the Super Admin role. Accessible
        only by Super Admins.
      summary: List all Platform Super Admins
      tags:
      - Admin & Staff Management
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformAdminItem'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: admin_platform_admins_create
      description: Creates a new super admin user or promotes an existing user account
        to Super Admin.
      summary: Create or promote a Platform Super Admin
      tags:
      - Admin & Staff Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAdminCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlatformAdminCreateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatformAdminCreateRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAdminCreateResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/verifications/:
    get:
      operationId: admin_verifications_retrieve
      description: Returns all self-registered facilities and doctors awaiting Super
        Admin verification.
      summary: List pending facility and doctor verifications
      tags:
      - Admin & Staff Management
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationQueueResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/verifications/{entity_type}/{entity_id}/:
    post:
      operationId: admin_verifications_create
      description: Allows Super Admin to approve (marking verified and live) or reject
        (deactivating) a pending registration.
      summary: Approve or reject a pending facility or doctor verification
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        description: UUID of the facility location or doctor
        required: true
      - in: path
        name: entity_type
        schema:
          type: string
        description: 'Entity type: ''facility'' or ''doctor'''
        required: true
      tags:
      - Admin & Staff Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationActionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerificationActionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationActionRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationActionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/affiliations/:
    get:
      operationId: affiliations_list
      description: |-
        ViewSet mixin that narrows querysets based on the authenticated user's role.
        Integrates with new RBAC system while keeping fallback legacy scoping.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Doctors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoctorAffiliationList'
          description: ''
    post:
      operationId: affiliations_create
      description: |-
        ViewSet mixin that narrows querysets based on the authenticated user's role.
        Integrates with new RBAC system while keeping fallback legacy scoping.
      tags:
      - Doctors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorAffiliationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DoctorAffiliationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DoctorAffiliationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
