          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDoctorAffiliationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAffiliation'
          description: ''
    delete:
      operationId: affiliations_destroy
      description: |-
        ViewSet mixin that narrows querysets based on the authenticated user's role.
        Integrates with new RBAC system while keeping fallback legacy scoping.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this doctor affiliation.
        required: true
      tags:
      - Doctors
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates a user via phone number and password, returning JWT
