            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAffiliation'
          description: ''
  /api/affiliations/{id}/:
    get:
      operationId: affiliations_retrieve
      description: |-
        ViewSet mixin that narrows querysets based on the authenticated user's role.
        Integrates with new RBAC system while keeping fallback legacy scoping.
      parameters:
