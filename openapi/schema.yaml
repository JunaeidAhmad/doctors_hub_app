  /api/auth/me/permissions/:
    get:
      operationId: auth_me_permissions_retrieve
      description: |-
        GET /api/auth/me/permissions/
        Returns the user's effective permissions and scope.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Exchanges a valid refresh token (from body or httpOnly cookie)
